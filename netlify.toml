# Netlify builds Drop for its own host. Secrets go in the site's environment variables (docs/self-host/netlify).
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  DROP_HOST = "netlify"
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  included_files = ["node_modules/@libsql/linux-x64-gnu/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
