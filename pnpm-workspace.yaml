  "@better-auth/oauth-provider": 1.7.28
  vite@*: "catalog:"

patchedDependencies:
  # A failed Send says why (drop#301): `problem` ("delivery", "key-unset", "key-invalid") and the receiver's `agent` on
  # the failed result, the receiver's HTTP status or timeout from the webhook delivery, and Send or Pair again re-pairs
  # after a key problem. A status refresh keeps a failed Send, pairing or Allow failed, with the newest count, while
  # comments still wait, without cancelling a retry in flight (vite-hub/vitehub#5526). The outbox from
  # vite-hub/vitehub#5540 (merged): a comment shows the moment Send is pressed and its screenshot follows. Files the reader
  # picked save at once while the screenshot is on its way, as `deferredFiles` (vite-hub/vitehub#5553). Delete when
  # ViteHub ships #5526 and #5553, and move the pins to that commit.
  "@vite-hub/comments@0.0.0-preview-44d6790": patches/@vite-hub__comments@0.0.0-preview-44d6790.patch
  # A standalone screenshot's note off to one side of its point (side=top|bottom with `to`) ran up to 14rem past the
  # image and widened the page; 0.14.3 limits and fits such notes only inside ::compare. This gives a standalone
  # screenshot the same fit check (onmax/comark-ui#491). Delete with the next comark-ui bump that includes it.
  comark-annotate@0.14.3: patches/comark-annotate@0.14.3.patch
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  # Preserves the full server identity in both protocol eras.
  # Names a refused token `invalid_token` on the 401 challenge (RFC 6750 §3.1), as h3js/mcp@998d52a does; unreleased.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # Runs nuxt-security 2.7.0 on Nuxt 5 / Nitro v3 / h3 v2: Nitro v3 imports, headers set in render:html (Nuxt 5 has no
  # render:response), x-powered-by removed in the response hook, getRouteRules(method, path), nitro/types augments,
  # basic auth without a Node request, and request middlewares registered only for features in use. Delete when
  # Baroshem/nuxt-security#769 ships.
  nuxt-security@2.7.0: patches/nuxt-security@2.7.0.patch

# Only workerd (local Workers runtime) needs its install script.
