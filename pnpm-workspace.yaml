blockExoticSubdeps: false

overrides:
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.10
  # Nuxt and Nuxt UI must share one Vue instance. 3.5.42+ fixes an SSR attribute-name XSS (@vue/server-renderer).
  vue: 3.5.44
  # Nuxt's payload serializer; 5.9.3+ fixes several uneval/stringify advisories.
  devalue: ^5.9.4
  vite@*: "catalog:"
  # Nuxt UI's editor menus stay on @tiptap/core's 3.31.4; a 3.32 menu beside core 3.31.4 breaks them.
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4
  # One h3 v2 in the server bundle. Nitro and ViteHub asked for older release candidates; Nitro's rc.22 answered a
  # malformed escape such as /f/%E0%A4 with a 500 before any of Drop's middleware ran.
  "h3@2.0.1-rc.22": 2.0.1
  "h3@2.0.1-rc.33": 2.0.1

patchedDependencies:
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  # Preserves the full server identity in both protocol eras.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # Types `handleCacheHeaders` on cachedEventHandler options, and guards `nuxt dev`, where the nightly CLI gives Vite
  # no httpServer for WebSocket upgrades. In dev it also resolves bare imports from virtual modules (Nuxt's paths.mjs
  # imports ufo) through the plugins: Vite looked for them in the project root, where pnpm hoists nothing, and 500ed.
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
  # Keeps Nuxt's dev-only module URL out of the Workers bundle.
  nuxt-nightly@5.0.0-29766097.1e475df9: patches/nuxt-nightly@5.0.0-29766097.1e475df9.patch
  # Runs nuxt-security 2.6.0 on Nuxt 5 / Nitro v3 / h3 v2: Nitro v3 imports, headers set in render:html (Nuxt 5 has no
  # render:response), x-powered-by removed in the response hook, getRouteRules(method, path), nitro/types augments,
  # basic auth without sendError or a Node request, and request middlewares registered only for features in use.
  nuxt-security@2.6.0: patches/nuxt-security@2.6.0.patch
  # Doctor false positives on h3 v2 apps: a parameter named `document` read as the browser global, and admin routes
  # that call requireAdmin, or Better Auth's re-exported mount, read as unguarded (onmax/vite-doctor#279, #280).
  vite-doctor@0.0.12: patches/vite-doctor@0.0.12.patch
  # Nitro's memory cache (Node hosts like Quiver) dropped every render with a 30-day TTL at once: a setTimeout over
  # 2^31-1 ms fires after 1 ms. Backport of unjs/unstorage#845 (in 2.0.0-alpha.11; Nitro pins alpha.7).
  unstorage@2.0.0-alpha.7: patches/unstorage@2.0.0-alpha.7.patch
  # comark-plugins main plus onmax/comark-plugins#25 and #15, built: a zoomed annotated screenshot shows its notes
  # beside it, a mark lights up its note there, and the zoom's events map copies to the page and back (copyOf and
  # originalOf, which Drop's frame runtime anchors comments in the zoom with). Drop both once a release has #25 and #15.
  comark-zoom@0.2.0: patches/comark-zoom@0.2.0.patch
  comark-annotate@0.2.0: patches/comark-annotate@0.2.0.patch
  # The Nuxt module aliased @vite-hub/database/runtime/state to ViteHub's own re-export of it, which imports that
  # specifier, so the bundled module imported itself and every request failed with "runWithDatabaseRequest is not a
  # function". The alias names @vite-hub/database's file instead.
  vite-hub@0.0.4: patches/vite-hub@0.0.4.patch
  # Deno's package copier sees mdream's architecture branches even when those native packages are not published.

# Only workerd (local Workers runtime) needs its install script.
allowBuilds:
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - evlog@2.30.1
  - nitro-mcp-toolkit@0.4.0
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/oauth-provider@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/stripe@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10
  - comark-annotate@0.2.0
  - comark-carousel@0.2.0
  - comark-zoom@0.2.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
