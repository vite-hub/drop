  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.15
  "@better-auth/oauth-provider": 1.7.15
  # Nuxt and Nuxt UI must share one Vue instance. 3.5.42+ fixes an SSR attribute-name XSS (@vue/server-renderer).
  vue: 3.5.44
  # Keep older consumers on the patched v5 serializer without downgrading Nuxt's v6.
  devalue@5: ^5.9.4
  # Nuxt's nightly asks for ^3.0.261029-rc, which matches no later release candidate. This keeps one Nitro.
  nitro: 3.0.261103-rc
  vite@*: "catalog:"
  # Nuxt UI's editor menus stay on @tiptap/core's 3.31.4; a 3.32 menu beside core 3.31.4 breaks them.
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4

patchedDependencies:
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  # Preserves the full server identity in both protocol eras.
  # Names a refused token `invalid_token` on the 401 challenge (RFC 6750 §3.1), as h3js/mcp@998d52a does; unreleased.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # Runs nuxt-security 2.7.0 on Nuxt 5 / Nitro v3 / h3 v2: Nitro v3 imports, headers set in render:html (Nuxt 5 has no
  # render:response), x-powered-by removed in the response hook, getRouteRules(method, path), nitro/types augments,
  # basic auth without a Node request, and request middlewares registered only for features in use.
  nuxt-security@2.7.0: patches/nuxt-security@2.7.0.patch
  # UTextarea's autoresize shrank the box to its minimum rows on every keystroke to measure it, which flashed the
  # overlay scrollbar of a comment past maxrows. Measures a hidden copy instead (nuxt/ui#7267). Also scrolls to the
  # bottom when typing at the end, so a new line isn't left on the bottom edge; native textareas stop short of the
  # padding, so keep this part after #7267 ships.
  "@nuxt/ui@4.11.0": patches/@nuxt__ui@4.11.0.patch
  # A refresh copied the approving browser session's id into the new access token even after that session expired,
  # so ViteHub's verifyMcpRequest (and Better Auth's own introspection) refused every renewed MCP token. The refresh
  # grant now drops a dead session's id, as validateRefreshToken already does. Not reported upstream yet.
  "@better-auth/oauth-provider@1.7.15": patches/@better-auth__oauth-provider@1.7.15.patch

