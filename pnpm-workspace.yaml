  "@vite-hub/content>comark-ui": https://pkg.pr.new/onmax/comark-ui/comark-ui@d99e4d126b2ae44a99bbc37fb263a0ab6cd73665
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.15
  "@better-auth/oauth-provider": 1.7.15
  comark-zoom: https://pkg.pr.new/onmax/comark-ui/comark-zoom@d99e4d126b2ae44a99bbc37fb263a0ab6cd73665
