patchedDependencies:
  # A slide that is one image shows the photo filling the slide at 4:3, with no panel, scrolled to the end, a bleeding
  # carousel's last page lines up with the text column, and with --cc-bleed-start the slides scroll out to the frame's
  # left edge (onmax/comark-ui#503, which took in #502). The pkg.pr.new build Drop pins keeps comark-ui's version, 0.14.3.
  # Delete with the next comark-ui bump that includes #503.
  comark-carousel@0.14.3: patches/comark-carousel@0.14.3.patch
  # Keep a vote-only event from writing the note cached in its tab. Drop this patch once the pin emits only note edits.
  comark-quiz@0.14.3: patches/comark-quiz@0.14.3.patch
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  # Preserves the full server identity in both protocol eras.
  # Names a refused token `invalid_token` on the 401 challenge (RFC 6750 §3.1), as h3js/mcp@998d52a does; unreleased.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # Runs nuxt-security 2.7.0 on Nuxt 5 / Nitro v3 / h3 v2: Nitro v3 imports, headers set in render:html (Nuxt 5 has no
  # render:response), x-powered-by removed in the response hook, getRouteRules(method, path), nitro/types augments,
  # basic auth without a Node request, and request middlewares registered only for features in use. Delete when
  # Baroshem/nuxt-security#769 ships.
  nuxt-security@2.7.0: patches/nuxt-security@2.7.0.patch

# Only workerd (local Workers runtime) needs its install script.
allowBuilds:
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

