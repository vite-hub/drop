blockExoticSubdeps: false

overrides:
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.10
  # Nuxt and Nuxt UI must share one Vue instance. 3.5.42+ fixes an SSR attribute-name XSS (@vue/server-renderer).
  vue: 3.5.44
  # Keep older consumers on the patched v5 serializer without downgrading Nuxt's v6.
  devalue@5: ^5.9.4
  # alpha.10 still overflows setTimeout for the 30-day Markdown cache TTL.
  nitro>unstorage: 2.0.0-alpha.11
  vite@*: "catalog:"
  # Nuxt UI's editor menus stay on @tiptap/core's 3.31.4; a 3.32 menu beside core 3.31.4 breaks them.
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4
  # One h3 v2 in the server bundle. Nitro and ViteHub asked for older release candidates; Nitro's rc.22 answered a
  # malformed escape such as /f/%E0%A4 with a 500 before any of Drop's middleware ran.
  "h3@2.0.1-rc.22": 2.0.1
  "h3@2.0.1-rc.33": 2.0.1

patchedDependencies:
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  # Preserves the full server identity in both protocol eras.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # Runs nuxt-security 2.6.0 on Nuxt 5 / Nitro v3 / h3 v2: Nitro v3 imports, headers set in render:html (Nuxt 5 has no
  # render:response), x-powered-by removed in the response hook, getRouteRules(method, path), nitro/types augments,
  # basic auth without sendError or a Node request, and request middlewares registered only for features in use.
  nuxt-security@2.6.0: patches/nuxt-security@2.6.0.patch
  # Doctor false positives on h3 v2 apps: a parameter named `document` read as the browser global, and admin routes
  # that call requireAdmin, or Better Auth's re-exported mount, read as unguarded (onmax/vite-doctor#279, #280).
  vite-doctor@0.0.12: patches/vite-doctor@0.0.12.patch
  # A zoomed screenshot's Copy action belongs in the zoom header, clear of its image and marks.
  comark-annotate@0.7.2: patches/comark-annotate@0.7.2.patch
  # Nuxt runs Vite without an HTTP server; virtual importers also need the plugin resolver.
  nitro@3.0.260903-beta: patches/nitro@3.0.260903-beta.patch
  # Generated dev handlers import Content relative to the handler so TypeScript and Vite resolve it on Windows too.
  "@vite-hub/content@0.0.4": patches/@vite-hub__content@0.0.4.patch
  # useServerEnv() reuses its result while the env names it reads hold the same values; every call copied the whole env
  # and checked each declaration again, ~85 ms of CPU per Drops page render (sharePolicy runs once per listed row).
  "@vite-hub/env@0.0.4": patches/@vite-hub__env@0.0.4.patch

# Only workerd (local Workers runtime) needs its install script.
allowBuilds:
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - evlog@2.30.1
  - nitro-mcp-toolkit@0.4.0
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/oauth-provider@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/stripe@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10
  - "@nuxt/kit-nightly@5.0.0-2610270115-58d7824"
  - "@nuxt/nitro-server-nightly@5.0.0-2610270115-58d7824"
  - "@nuxt/schema-nightly@5.0.0-2610270115-58d7824"
  - "@nuxt/vite-builder-nightly@5.0.0-2610270115-58d7824"
  - "@nuxt/vite-server-nightly@5.0.0-2610270115-58d7824"
  - nuxt-nightly@5.0.0-2610270115-58d7824
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
