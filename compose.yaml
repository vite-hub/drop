services:
  drop:
    # The published image: SQLite in the drop-data volume. DROP_IMAGE_TAG pins a release, such as 0.1.0.
    # Building it yourself, for a D1 database: add compose.build.yaml (docs/self-host/vps#d1).
    image: ghcr.io/vite-hub/drop:${DROP_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - drop-data:/app/.data
    restart: unless-stopped

volumes:
  drop-data:
