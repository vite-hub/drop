name: image

# Publishes ghcr.io/vite-hub/drop, the image self-hosters run (docs/self-host/vps):
#   main          every push to main
#   sha-<7 chars> every push to main and every release
#   0.1.0, 0.1    a release tag such as v0.1.0
#   latest        the newest release, not a prerelease such as v0.2.0-rc.1
# Pull requests that touch the image build it and run the smoke test, without publishing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - patches/**
      - nuxt.config.ts
      - scripts/start.mjs
      - scripts/migrate-d1.mjs
      - scripts/deployment.ts
      - server/databases/**
      - test/deploy/image-smoke.mjs
      - .github/workflows/image.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vite-hub/drop

jobs:
  # Builds on a native runner per platform: arm64 under QEMU takes several times as long.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      # The smoke test runs the image it just built, from the local Docker store.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: DROP_COMMIT=${{ github.sha }}
          load: true
          tags: drop:ci
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Upgrades from the last image published from main when there is one.
      - run: |
          if docker pull --platform "$PLATFORM" "$IMAGE:main" >/dev/null 2>&1; then
            node test/deploy/image-smoke.mjs drop:ci "$IMAGE:main"
          else
            node test/deploy/image-smoke.mjs drop:ci
          fi
        env:
          PLATFORM: ${{ matrix.platform }}
      - if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: DROP_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins both platforms under the tags.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` only for release tags, never for main.
          flavor: latest=false
      - working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$RELEASE" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
