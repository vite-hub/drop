name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The migration check needs the base branch's history to find the merge base.
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs "origin/$GITHUB_BASE_REF"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt --check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      # `run`: pnpm 11's own `pnpm doctor` checks the pnpm install, not the project.
      - run: pnpm run doctor
      # Firefox too: the doc header's copy and the zoom's comment layer have Firefox tests (Drop comment #12).
      # WebKit: Export as PDF has a test for Safari's video that stops before its first frame.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
      - run: pnpm --filter @vite-hub/drop test
      - run: pnpm build
